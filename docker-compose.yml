services:
  # Frontend Service: React App served via Nginx
  vita-care-frontend:
    container_name: vita-care-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      vita-care-backend:
        condition: service_healthy
    networks:
      - vita-care-network
    restart: unless-stopped

  # Backend Service: FastAPI App
  vita-care-backend:
    container_name: vita-care-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      # These should be set in a .env file or passed at runtime
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_ALGORITHM=${JWT_ALGORITHM:-HS256}
      - JWT_EXPIRATION_HOURS=${JWT_EXPIRATION_HOURS:-24}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/').read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - vita-care-network
    restart: unless-stopped

  # WhatsApp Service: Node.js Puppeteer App
  vita-care-whatsapp:
    container_name: vita-care-whatsapp
    build:
      context: ./whatsapp
      dockerfile: Dockerfile
    environment:
      - BACKEND_URL=http://vita-care-backend:8000
    volumes:
      # Persist whatsapp session
      - whatsapp-session:/app/.wwebjs_auth
    depends_on:
      vita-care-backend:
        condition: service_healthy
    networks:
      - vita-care-network
    restart: unless-stopped

networks:
  vita-care-network:
    driver: bridge

volumes:
  whatsapp-session:
